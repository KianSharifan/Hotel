services:

  backend:
    build:
      context: ./Hotel
      dockerfile: Dockerfile

    ports:
      - "5263:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=HotelDB;Username=postgres;Password=postgres"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:80"

    depends_on:
      - backend


  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: HotelDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HotelDB"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: